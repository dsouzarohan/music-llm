[project]
name = "music-llm"
version = "0.1.0"
description = "A music transformer trained on MIDI tokens to generate guitar sequences"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "miditok==3.0.5.post1",
    "symusic>=0.5.7,<0.6",
    "music21>=9.3",
    "numpy>=2.2",
    "tqdm>=4.67",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "matplotlib>=3.10",
]
