# Phase 2 T5 ablation 1/5 (old block: huang, layernorm, gelu, untied). Same shape and token budget as the other four:
# 8L/512/8H, context 2048, 50 epochs x 2000 windows = 204.8M tokens. Needs the Drive corpus (vocab 3500).
name = "ablation-30m-1-old"
vocab_size = 3500
block_size = 2048
n_layer = 8
n_head = 8
embedding_dim = 512
dropout = 0.1
batch_size = 64
micro_batch_size = 16
learning_rate = 3e-4
epochs = 50
train_windows = 2000
val_windows = 512
save_every = 2
keep_last = 1
pos = "huang"
norm = "layernorm"
mlp = "gelu"
qk_norm = false
tie_embeddings = false
