# Phase 2 T6: the baseline's 24L/768/12H shape with the full modern block (144.4M params) and the T5
# training settings, on the baseline's compute budget: 1318 MFLOP/token x 59 epochs x 2000 windows x 2048
# = 242M tokens = 3.18e17 FLOPs. Needs the Drive corpus (vocab 3500).
name = "t6-186m-equal-compute"
vocab_size = 3500
block_size = 2048
n_layer = 24
n_head = 12
embedding_dim = 768
dropout = 0.1
batch_size = 64
micro_batch_size = 4
learning_rate = 3e-4
epochs = 59
train_windows = 2000
val_windows = 512
save_every = 2
keep_last = 1
pos = "rope"
norm = "rmsnorm"
mlp = "swiglu"
qk_norm = true
tie_embeddings = true
